name: test
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - '.examples/**'
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.examples/**'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The levels size their parallel test workers from this (DLV-002).
      CI_SLOT_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      # DLV-002: the change level on a pull request, the full level on the
      # integration branch. The job used to run `go test ./... -race` under sudo
      # for a privileged ICMP path; a level cannot run as root (the slot reads
      # git), so the suite runs as the runner user and TestPing uses an
      # unprivileged ICMP socket.
      - name: Change level
        if: github.event_name == 'pull_request'
        run: mise run ci
      - name: Full level
        if: github.event_name == 'push'
        run: mise run ci:full
