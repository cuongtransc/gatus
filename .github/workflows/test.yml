name: test
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - '.examples/**'
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.examples/**'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The levels size their parallel test workers from this (DLV-002).
      CI_SLOT_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      # DLV-002: the change level on a pull request, the full level on the
      # integration branch. The suite used to run under sudo for a privileged
      # ICMP path no unit test exercises; it now runs unprivileged.
      - name: Change level
        if: github.event_name == 'pull_request'
        run: mise run ci
      - name: Full level
        if: github.event_name == 'push'
        run: mise run ci:full
